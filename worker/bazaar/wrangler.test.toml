name = "asicc-bazaar-test-api"
main = "index.mjs"
compatibility_date = "2026-11-20"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false
keep_vars = true

[vars]
BAZAAR_MODE = "test"
FIREBASE_PROJECT_ID = "asicc-bazaar-test"
BAZAAR_SITE_URL = "https://test-partial-refund-rib.asicc-integration-test.pages.dev"
