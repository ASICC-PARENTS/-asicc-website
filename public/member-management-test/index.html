<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>ASICC 회원관리 테스트</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f1;color:#20352c;font:15px/1.65 system-ui,sans-serif}header{background:#173b30;color:#fff;padding:20px max(5%,calc((100% - 1000px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}header strong{font-size:24px}main{max-width:1000px;margin:24px auto;padding:0 18px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}button,select,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #2b6250;background:#fff;color:#254c3c;border-radius:7px;padding:9px 15px}button.primary,nav button.active{background:#254c3c;color:white}button:disabled{opacity:.5;cursor:not-allowed}.panel,.card{background:white;border:1px solid #dde5dc;border-radius:12px;padding:24px;margin-bottom:14px}.card{padding:16px}h1,h2,h3{line-height:1.35;margin:0 0 12px}p{margin:8px 0 14px}label.field{display:block;font-weight:600;margin:12px 0}label.field input,label.field select,label.field textarea{display:block;width:100%;padding:9px;border:1px solid #b9c7be;border-radius:6px;background:white;margin-top:4px}label.choice{display:flex;align-items:flex-start;gap:8px;margin:9px 0}input[type=radio],input[type=checkbox]{margin-top:5px;accent-color:#254c3c}small,.muted{color:#58675d}hr{border:0;border-top:1px solid #dde5dc;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.notice{padding:13px;background:#eaf3ed;border-radius:8px;margin:12px 0}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{text-align:left;padding:9px;border-bottom:1px solid #ddd}th{background:#edf2ee}dialog{max-width:min(630px,94vw);border:1px solid #c8d5cd;border-radius:12px;padding:24px;color:inherit}dialog::backdrop{background:#0007}pre{white-space:pre-wrap}.danger{color:#a33}footer{font-size:13px;color:#68786d;margin:20px 0}@media(max-width:520px){.panel{padding:16px}header{padding:15px}}
</style><header><div><strong>ASICC</strong><div id="subtitle">회원관리 독립 테스트</div></div><button id="reset" type="button">초기화</button></header><main><div class="notice" id="safe">가상 데이터 전용 · Firebase, 외부 서비스, 실제 계정과 연결되지 않습니다. 실제 개인정보를 입력하지 마세요.</div><nav id="nav"></nav><section class="panel" id="app"></section><footer>ASICC · Prototype V1 · 2026-11-24</footer></main><dialog id="modal"></dialog><script>
'use strict'; const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const cities=['Courbevoie','Asnières-sur-Seine','Bois-Colombes','Colombes','Gennevilliers','La Garenne-Colombes','Paris','Puteaux'];const roles=['일반 회원','협회 정회원','협회 특별 회원','운영진'];const grades=['PS','MS','GS','CP','CE1','CE2','CM1','CM2','6e','5e','4e','3e'];const scopes=['갤러리','대외 홍보'];const today=()=>new Date().toISOString();let state;let page='signup',photoTab='consent',filter='all',q='',selected=null;function seed(){return {me:{id:'demo-1',name:'테스트 회원',nick:'Parent A',email:'parent@example.test',city:'Courbevoie',role:roles[0],association:'미가입',web:true,children:[],consent:{},history:[],requests:[],joined:today(),relation:'',pending:null},others:[{id:'demo-2',name:'회원 B',nick:'Parent B',email:'b@example.test',city:'Paris',role:roles[1],association:roles[1],web:true,children:[{id:'child-b',name:'학생 B',school:'초등학교',grade:'CM1',status:'재학',consent:{'갤러리':'동의','대외 홍보':'미동의'}}],consent:{'갤러리':'동의','대외 홍보':'미동의'},history:[],requests:[],joined:today(),relation:'어머니',pending:null},{id:'demo-3',name:'회원 C',nick:'Parent C',email:'c@example.test',city:'Colombes',role:roles[0],association:'미가입',web:true,children:[],consent:{},history:[],requests:[],joined:today(),relation:'',pending:null}]}}state=seed();const me=()=>state.me;const people=()=>[me(),...state.others];const personList=m=>[{id:'self',name:'본인',consent:m.consent},...m.children];const cityOptions=c=>[...cities,'기타'].map(x=>'<option '+(x===c||x==='기타'&&!cities.includes(c)?'selected':'')+'>'+esc(x)+'</option>').join('');const opt=(list,v)=>list.map(x=>'<option '+(x===v?'selected':'')+'>'+esc(x)+'</option>').join('');const field=(label,n,v='',type='text',req=true)=>'<label class="field">'+label+'<input name="'+n+'" type="'+type+'" value="'+esc(v)+'" '+(req?'required':'')+'></label>';const choice=(n,v,l,checked=false,type='radio')=>'<label class="choice"><input type="'+type+'" name="'+n+'" value="'+esc(v)+'" '+(checked?'checked':'')+'><span>'+l+'</span></label>';const cityField=c=>'<label class="field">거주 도시 *<select name="city" required>'+cityOptions(c)+'</select></label><label class="field" id="otherCity" '+(cities.includes(c)?'hidden':'')+'>기타 도시<input name="otherCity" value="'+esc(cities.includes(c)?'':c)+'"></label>';function bindCity(form){const sel=form.elements.city;if(!sel)return;const other=form.elements.otherCity;const show=()=>{$('#otherCity').hidden=sel.value!=='기타';other.required=sel.value==='기타'};sel.onchange=show;show()}const cityVal=f=>f.elements.city.value==='기타'?f.elements.otherCity.value.trim():f.elements.city.value;const app=$('#app');function go(p){page=p;render()}function render(){const labels={signup:'회원가입',promotion:'승급 신청',profile:'마이페이지',photo:'사진 및 영상 관리',withdraw:'회원 탈퇴',admin:'운영진 테스트'};$('#nav').innerHTML=Object.entries(labels).map(([k,v])=>'<button data-page="'+k+'" class="'+(page===k?'active':'')+'">'+v+'</button>').join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.page));({signup,promotion,profile,photo,withdraw,admin})[page]()}function message(t){const el=$('#msg');if(el)el.textContent=t}function signup(){app.innerHTML='<h1>회원가입</h1><p><b>홈페이지 회원가입과 ASICC 협회 회원가입은 별도로 운영됩니다.</b> 홈페이지 회원가입은 무료입니다.</p><div class="card"><h3>일반 회원</h3>학습자료실 열람 및 다운로드, 회원 게시판 열람.<hr><h3>협회 정회원</h3>현재 꾸르브부아 한국어 국제섹션 재학생의 학부모. 운영진 전용 온라인 협회 사무실을 제외한 모든 회원 서비스 이용: 학습자료 등록, 게시판 글·댓글 작성, 갤러리 이용.<hr><h3>협회 특별 회원 (후원 회원)</h3>졸업생, 졸업·전학생 학부모, 교사, 학교 관계자 및 협회 활동 지지자. 정회원과 동일한 홈페이지 이용 권한.<hr>일반 회원 가입 및 이메일 인증 후 마이페이지에서 승급 신청하고 관리자의 승인을 받습니다. 협회비는 가구당 연 20유로 자율납부이며 회원 자격과 무관합니다.</div><form id="form">'+field('실명 *','name')+field('닉네임 *','nick')+field('이메일 (가상 주소) *','email','','email')+cityField('Courbevoie')+'<label class="field">계정 유형<select name="account"><option>성인 / 보호자</option><option>학생 / 졸업생</option></select></label><div id="birth" hidden>'+field('생년월일 (가상 정보)','birth','','date',false)+'</div><h3>가입 유형 선택 *</h3>'+choice('join','web','현재는 협회 회원 가입을 희망하지 않으며, 홈페이지 일반 회원으로만 가입하고자 합니다.')+choice('join','association','홈페이지 회원가입과 함께 ASICC 협회 회원 가입도 희망합니다.')+'<div id="joinInfo" class="notice" hidden></div>'+choice('privacy','yes','개인정보 처리방침을 확인했습니다.',false,'checkbox')+choice('rules','yes','회원 및 게시판 이용 규칙을 확인했습니다.',false,'checkbox')+'<button class="primary">테스트 가입</button><p id="msg" class="danger"></p></form><small>비밀번호 및 이메일 인증은 실제 시스템과 분리하기 위해 이 화면에서 수집하거나 전송하지 않습니다.</small>';const f=$('#form');bindCity(f);f.elements.account.onchange=()=>{$('#birth').hidden=f.elements.account.selectedIndex===0;f.elements.birth.required=!$('#birth').hidden};f.querySelectorAll('[name=join]').forEach(i=>i.onchange=()=>{$('#joinInfo').hidden=false;$('#joinInfo').textContent=i.value==='association'?'가입 및 이메일 인증 후 마이페이지에서 승급 신청을 진행합니다.':'나중에 언제든지 마이페이지에서 승급 신청할 수 있습니다.'});f.onsubmit=e=>{e.preventDefault();if(!f.elements.join.value||!f.elements.privacy.checked||!f.elements.rules.checked){message('가입 유형과 필수 확인 항목을 선택하세요.');return}if(!cityVal(f)){message('거주 도시를 입력하세요.');return}state.me={...seed().me,name:f.elements.name.value.trim(),nick:f.elements.nick.value.trim(),email:f.elements.email.value,city:cityVal(f)};go(f.elements.join.value==='association'?'promotion':'profile')}}function childrenHtml(m){return m.children.map((c,i)=>'<div class="card"><div class="actions"><b>자녀 '+(i+1)+'</b><button type="button" data-remove="'+i+'">삭제</button></div>'+field('학생 실명','childName'+i,c.name)+field('학교명 (가상)','school'+i,c.school)+'<div class="grid"><label class="field">학년<select name="grade'+i+'">'+opt(grades,c.grade)+'</select></label><label class="field">상태<select name="status'+i+'">'+opt(['재학','졸업','전학'],c.status)+'</select></label></div></div>').join('')}function readChildren(f,m){m.children.forEach((c,i)=>{if(f.elements['childName'+i])Object.assign(c,{name:f.elements['childName'+i].value,school:f.elements['school'+i].value,grade:f.elements['grade'+i].value,status:f.elements['status'+i].value})})}function bindChildren(f,m){$('#addChild').onclick=()=>{readChildren(f,m);m.children.push({id:'c'+Math.random().toString(36).slice(2),name:'',school:'',grade:'CP',status:'재학',consent:{}});render()};f.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{readChildren(f,m);m.children.splice(Number(b.dataset.remove),1);render()})}function consentFields(m){return personList(m).map((p,i)=>'<div class="card"><b>'+esc(p.name||'자녀 '+i)+'</b>'+scopes.map((s,j)=>'<div>'+s+choice('cons'+i+'_'+j,'동의','동의합니다',p.consent[s]==='동의')+choice('cons'+i+'_'+j,'미동의','동의하지 않습니다',p.consent[s]==='미동의')+'</div>').join('')+'</div>').join('')}function promotion(){const m=me();if(m.pending){app.innerHTML='<h1>승급 신청</h1><div class="notice">승급 승인 대기: '+esc(m.pending)+'</div><p>운영진 테스트 탭에서 승인할 수 있습니다.</p>';return}app.innerHTML='<h1>협회 회원 승급 신청</h1><p>'+esc(m.name)+' · '+esc(m.city)+'</p><form id="form"><label class="field">신청 유형<select name="type">'+opt(roles.slice(1,3),m.requestType||roles[1])+'</select></label><label class="field">신청자 구분<select name="relation">'+opt(['어머니','아버지','학생','교사','학교 관계자','기타'],m.relation)+'</select></label>'+field('협회와의 관계 / 신청 사유 (해당자)','reason',m.reason||'','text',false)+'<h3>자녀 및 재학 정보</h3>'+childrenHtml(m)+'<button type="button" id="addChild">+ 자녀 추가</button><hr><h3>사진 및 영상 사용 동의</h3><p>아이들의 소중한 순간을 함께 나누고 기록합니다. 교사가 공유하는 수업과 작품, 한국 문화 체험, 학교 행사와 협회 활동 사진을 통해 직접 함께하지 못한 순간을 간직할 수 있습니다.</p><p>회원 전용 갤러리와 홈페이지 공개 영역·SNS 등 대외 홍보는 별도 동의입니다. 동의 여부는 회원 자격에 영향을 주지 않습니다.</p>'+consentFields(m)+'<button class="primary">승급 신청 제출</button><p id="msg" class="danger"></p></form>';const f=$('#form');const save=()=>{m.requestType=f.elements.type.value;m.relation=f.elements.relation.value;m.reason=f.elements.reason.value};f.onchange=e=>{if(['type','relation','reason'].includes(e.target.name))save()};bindChildren(f,m);f.onsubmit=e=>{e.preventDefault();save();readChildren(f,m);if(m.requestType===roles[1]&&!m.children.some(c=>c.status==='재학')){message('재학생 자녀 정보를 추가하세요.');return}let missing=false;personList(m).forEach((p,i)=>scopes.forEach((s,j)=>{const v=f.elements['cons'+i+'_'+j].value;if(!v)missing=true;else p.consent[s]=v}));if(missing){message('각 사진 사용 목적에 동의 또는 미동의를 선택하세요.');return}m.pending=m.requestType;render()}}function profile(){const m=me();app.innerHTML='<h1>마이페이지</h1><p><b>'+esc(m.role)+'</b> · 협회 자격 '+esc(m.association)+' · 홈페이지 '+(m.web?'정상':'탈퇴')+'</p><form id="form">'+field('실명','name',m.name)+field('닉네임','nick',m.nick)+cityField(m.city)+'<h3>자녀 및 재학 정보</h3>'+childrenHtml(m)+'<button id="addChild" type="button">+ 자녀 추가</button><div class="actions"><button class="primary">정보 저장</button></div><p id="msg"></p></form><p>협회비 20유로 / 가구 / 년 · 자율납부</p>';const f=$('#form');bindCity(f);bindChildren(f,m);f.onsubmit=e=>{e.preventDefault();readChildren(f,m);Object.assign(m,{name:f.elements.name.value,nick:f.elements.nick.value,city:cityVal(f)});message('저장되었습니다. 관리자 승인 불필요 (가상)')}}function photo(){const m=me();app.innerHTML='<h1>사진 및 영상 관리</h1><nav>'+['consent','request','history'].map((t,i)=>'<button data-tab="'+t+'" class="'+(photoTab===t?'active':'')+'">'+['사용 동의 관리','블러 처리 요청','요청 내역'][i]+'</button>').join('')+'</nav><div id="photoBody"></div>';app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{photoTab=b.dataset.tab;photo()});const body=$('#photoBody');if(photoTab==='consent'){body.innerHTML=personList(m).map(p=>'<div class="card"><b>'+esc(p.name)+'</b>'+scopes.map(s=>'<p>'+s+' · '+esc(p.consent[s]||'미선택')+'</p><button data-person="'+p.id+'" data-scope="'+s+'" data-value="동의">동의</button> <button data-person="'+p.id+'" data-scope="'+s+'" data-value="미동의">미동의</button>').join('')+'</div>').join('');body.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{const p=personList(m).find(p=>p.id===b.dataset.person),s=b.dataset.scope,v=b.dataset.value;const apply=()=>{if(p.consent[s]!==v){m.history.push({person:p.name,scope:s,from:p.consent[s]||'미선택',to:v,date:today()});p.consent[s]=v}photo()};if(p.consent[s]==='동의'&&v==='미동의'){const d=$('#modal');d.innerHTML='<h2>사진 및 영상 사용 동의 철회</h2><p>향후 게시 사진에서는 해당 인물을 제외하거나 식별되지 않도록 처리하고 게시 권한자에게 필요한 범위에서 안내합니다.</p><p>기존 게시 사진에는 변경사항이 자동 반영되지 않습니다. 단체 사진의 추억을 보존하기 위해 해당 인물의 블러 처리를 우선합니다. 게시글 링크나 행사 정보를 알려주시면 확인하겠습니다. 사진을 찾지 못한 경우에도 요청할 수 있습니다.</p><p>아이들이 함께 배우고 성장하는 모습은 오래도록 소중한 추억이 됩니다. 철회 후에는 본인 또는 자녀의 모습이 앞으로 공유되는 사진에서 제외되거나 식별되지 않을 수 있습니다. 선택은 존중되며 회원 자격과 열람 권한은 그대로 유지됩니다.</p><div class="actions"><button id="cancel">기존 동의 유지</button><button id="confirm" class="primary">동의 철회</button><button id="both">철회 및 기존 사진 요청</button></div>';d.showModal();$('#cancel').onclick=()=>d.close();$('#confirm').onclick=()=>{d.close();apply()};$('#both').onclick=()=>{d.close();apply();photoTab='request';photo();$('#target').value=p.id}}else apply()})}else if(photoTab==='request'){body.innerHTML='<h3>기존 사진 및 영상 블러 처리 요청</h3><form id="requestForm"><label class="field">대상<select id="target" name="target">'+personList(m).map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select></label><label class="field">게시 위치<select name="location">'+opt(['회원 전용 갤러리','홈페이지 공개 영역','공식 SNS','기타'])+'</select></label><label class="field">게시글 링크, 행사명, 날짜, 사진 속 위치 (선택)<textarea name="info" rows="4"></textarea></label><button class="primary">요청 제출</button></form>';$('#requestForm').onsubmit=e=>{e.preventDefault();const f=e.target;m.requests.push({person:personList(m).find(p=>p.id===f.elements.target.value).name,location:f.elements.location.value,detail:f.elements.info.value,status:'처리 대기',date:today()});photoTab='history';photo()}}else body.innerHTML=m.requests.length?m.requests.map(r=>'<div class="card"><b>'+esc(r.person)+'</b> · '+esc(r.status)+'<p>'+esc(r.location)+' · '+esc(r.detail||'운영진 확인 요청')+'</p></div>').join(''):'접수된 요청이 없습니다.'}function withdraw(){const m=me();app.innerHTML='<h1>회원 탈퇴</h1><p>홈페이지 회원 자격과 ASICC 협회 회원 자격은 별도로 운영되며, 각각 독립적으로 탈퇴할 수 있습니다.</p><form id="form">'+choice('association','yes','ASICC 협회 회원 탈퇴',false,'checkbox')+choice('website','yes','홈페이지 회원 탈퇴',false,'checkbox')+'<div id="effect" class="notice">탈퇴할 항목을 선택하세요.</div><p>개인정보 및 사진·영상 관련 보호 조치 요청은 탈퇴 후에도 협회에 문의할 수 있습니다.</p>'+choice('confirm','yes','위 내용을 확인하고 선택한 회원 자격의 탈퇴를 희망합니다.',false,'checkbox')+'<button class="primary" disabled>탈퇴 신청</button></form>';const f=$('#form');f.elements.association.disabled=m.association==='미가입'||m.association==='탈퇴';f.elements.website.disabled=!m.web;const update=()=>{const a=f.elements.association.checked,w=f.elements.website.checked;$('#effect').textContent=a&&w?'협회 회원 자격과 홈페이지 회원 계정이 모두 종료됩니다. 공개 영역만 열람할 수 있습니다.':a?'협회 회원 자격을 종료하고 홈페이지 일반 회원으로 전환합니다. 학습자료실 및 게시판 열람은 유지됩니다.':w?'홈페이지 로그인 및 회원 전용 서비스 이용이 종료됩니다. 기존 협회 회원 자격은 유지됩니다.':'탈퇴할 항목을 선택하세요.';f.querySelector('button').disabled=!(a||w)||!f.elements.confirm.checked};f.onchange=e=>{if(e.target.name!=='confirm')f.elements.confirm.checked=false;update()};f.onsubmit=e=>{e.preventDefault();if(f.elements.association.checked){m.association='탈퇴';m.associationWithdrawn= today();m.role=roles[0]}if(f.elements.website.checked){m.web=false;m.webWithdrawn=today()}app.innerHTML='<h1>탈퇴 신청 접수 (가상)</h1><p>협회 상태: '+esc(m.association)+' · 홈페이지 상태: '+(m.web?'정상':'탈퇴')+'</p>'}}function admin(){const all=people();const rows=all.filter(m=>(filter==='all'||filter==='pending'&&m.pending||m.role===filter)&&[m.name,m.nick,m.email,m.city,...m.children.map(c=>c.grade)].some(v=>String(v).toLowerCase().includes(q.toLowerCase())));const m=all.find(x=>x.id===selected);app.innerHTML='<h1>운영진 회원관리</h1><div class="grid">'+roles.map(r=>'<div class="card"><small>'+r+'</small><h2>'+all.filter(m=>m.web&&m.role===r).length+'</h2></div>').join('')+'</div><div class="grid"><label class="field">검색<input id="search" value="'+esc(q)+'"></label><label class="field">등급<select id="filter">'+opt(['all',...roles,'pending'],filter)+'</select></label></div><div class="actions"><button id="exportAll">전체 명단 미리보기</button><button id="exportFiltered">필터 명단 미리보기</button></div><div class="scroll"><table><thead><tr><th>실명</th><th>등급</th><th>거주 도시</th><th>협회 상태</th><th>홈페이지</th><th>승급</th></tr></thead><tbody>'+rows.map(r=>'<tr><td><button data-id="'+r.id+'">'+esc(r.name)+'</button></td><td>'+esc(r.role)+'</td><td>'+esc(r.city)+'</td><td>'+esc(r.association)+'</td><td>'+(r.web?'정상':'탈퇴')+'</td><td>'+esc(r.pending||'')+'</td></tr>').join('')+'</tbody></table></div><div id="detail"></div><div id="export"></div>';$('#search').oninput=e=>{q=e.target.value;admin();const s=$('#search');s.focus();s.setSelectionRange(q.length,q.length)};$('#filter').onchange=e=>{filter=e.target.value;admin()};app.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{selected=b.dataset.id;admin()});$('#exportAll').onclick=()=>exportPreview(all);$('#exportFiltered').onclick=()=>exportPreview(rows);if(m){$('#detail').innerHTML='<hr><h2>'+esc(m.name)+' 상세 정보</h2><p>'+esc(m.email)+' · '+esc(m.city)+'</p>'+m.children.map(c=>'<p>'+esc(c.name)+' · '+esc(c.school)+' · '+esc(c.grade)+'</p>').join('')+(m.pending?'<div class="actions"><button class="primary" id="approve">승급 승인</button><button id="reject">반려</button></div>':'')+'<h3>동의 변경 이력</h3>'+m.history.map(h=>'<p>'+esc(h.person+' · '+h.scope+' · '+h.from+' → '+h.to+' · '+h.date)+'</p>').join('')+'<h3>블러 처리 요청</h3>'+m.requests.map((r,i)=>'<p>'+esc(r.person+' · '+r.detail+' · '+r.status)+' <button data-complete="'+i+'">처리 완료</button></p>').join('');if(m.pending){$('#approve').onclick=()=>{m.role=m.pending;m.association=m.pending;m.pending=null;m.approved=today();admin()};$('#reject').onclick=()=>{m.pending=null;admin()}}app.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>{m.requests[+b.dataset.complete].status='처리 완료';admin()})}}function exportPreview(rows){const n=Math.max(0,...rows.map(m=>m.children.length));let heads=['번호','실명','닉네임','이메일','회원 등급','거주 도시','홈페이지 상태','협회 상태','본인 갤러리','본인 홍보'];for(let i=1;i<=n;i++)heads.push(...['실명','학교','학년','재학 상태','갤러리 동의','홍보 동의'].map(h=>'자녀 '+i+' '+h));heads.push('가입일','승급일','홈페이지 탈퇴일','협회 탈퇴일');const values=rows.map((m,i)=>{let r=[i+1,m.name,m.nick,m.email,m.role,m.city,m.web?'정상':'탈퇴',m.association,m.consent['갤러리'],m.consent['대외 홍보']];for(let j=0;j<n;j++){const c=m.children[j];r.push(c?.name,c?.school,c?.grade,c?.status,c?.consent['갤러리'],c?.consent['대외 홍보'])}return [...r,m.joined,m.approved,m.webWithdrawn,m.associationWithdrawn]});$('#export').innerHTML='<hr><h3>Excel 단일 시트 구조 미리보기</h3><small>가상 데이터 '+rows.length+'행 · 실제 XLSX 생성은 통합 구현 전 별도 검증 필요</small><div class="scroll"><table><thead><tr>'+heads.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+values.map(r=>'<tr>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}$('#reset').onclick=()=>{state=seed();photoTab='consent';filter='all';q='';selected=null;go('signup')};render();
</script></html>
