name: Deploy ASICC integration test site

on:
  push:
    branches: [feat/online-bazaar]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asicc-integration-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build integration site
        run: npm run build:integration
        env:
          PUBLIC_ASICC_BAZAAR_TEST_API_KEY: AIzaSyBKYgkMrEVeGwmFtgxgiQMzQCG8UWV5Ego
          PUBLIC_ASICC_BAZAAR_TEST_APP_ID: 1:678821978206:web:a5d3bc7303fafe253dd4cf
      - name: Ensure Direct Upload Pages project exists
        shell: bash
        run: |
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/asicc-integration-test"
          status=$(curl -sS -o /tmp/pages-project.json -w '%{http_code}' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$endpoint")
          if [ "$status" = "200" ]; then
            echo "Pages project already exists."
          elif [ "$status" = "404" ]; then
            curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' \
              --data '{"name":"asicc-integration-test","production_branch":"feat/online-bazaar"}'
          else
            cat /tmp/pages-project.json
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b941b206ccc2aad94ae9b83ada2bc889
      - name: Deploy isolated test Bazaar Worker
        run: npx wrangler@4 deploy --config worker/bazaar/wrangler.test.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b941b206ccc2aad94ae9b83ada2bc889
      - name: Deploy to Cloudflare Pages
        run: npx wrangler@4 pages deploy dist --project-name=asicc-integration-test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b941b206ccc2aad94ae9b83ada2bc889
