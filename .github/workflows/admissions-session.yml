name: Isolated admissions session registration
on:
  push:
    branches:
      - feature/admissions-session-registration
      - deploy/admissions-session-worker
permissions:
  contents: read
concurrency:
  group: admissions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Registration validation and access tests
        run: node --test worker/admissions/registration.test.mjs
      - name: Install site dependencies
        run: npm ci
      - name: Test preview site build
        if: github.ref == 'refs/heads/feature/admissions-session-registration'
        run: npm run build
        env:
          SITE_URL: https://asicc-admissions-preview.pages.dev
          BASE_PATH: /
          PUBLIC_ASICC_ADMISSIONS_PREVIEW: 'true'
          PUBLIC_ASICC_ADMISSIONS_API: https://asicc-admissions-registration-test.falling-hall-f390.workers.dev
          PUBLIC_ASICC_BAZAAR_TEST: 'true'
          PUBLIC_ASICC_BAZAAR_TEST_API_KEY: AIzaSyBKYgkMrEVeGwmFtgxgiQMzQCG8UWV5Ego
          PUBLIC_ASICC_BAZAAR_TEST_APP_ID: 1:678821978206:web:a5d3bc7303fafe253dd4cf
          PUBLIC_ASICC_MEMBERS_ENABLED: 'true'
          PUBLIC_ASICC_INTEGRATION_TEST: 'true'
      - name: Deploy isolated test registration Worker
        if: github.ref == 'refs/heads/feature/admissions-session-registration'
        run: npx wrangler@4 deploy --config worker/admissions/wrangler.test.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b941b206ccc2aad94ae9b83ada2bc889
      - name: Verify isolated test Worker registration and access denial
        if: github.ref == 'refs/heads/feature/admissions-session-registration'
        shell: bash
        run: |
          set -euo pipefail
          endpoint=https://asicc-admissions-registration-test.falling-hall-f390.workers.dev
          origin=https://asicc-admissions-preview.pages.dev
          curl -fsS --retry 8 --retry-delay 5 --retry-all-errors --max-time 15 "$endpoint/health" | jq -e '.ok and .mode == "test"'
          data=$(jq -nc --arg email "test-${GITHUB_RUN_ID}@example.invalid" '{name:"TEST ONLY",email:$email,city:"Courbevoie",interest:"next_year",children:[{school:"mat",grade:"PS"},{school:"elem",grade:"CP"}],lang:"ko",consent:true}')
          curl -fsS "$endpoint/api/register" -H "Origin: $origin" -H 'Content-Type: application/json' -d "$data" | jq -e '.ok'
          for interest in future general; do
            data=$(jq -nc --arg email "test-${interest}-${GITHUB_RUN_ID}@example.invalid" --arg interest "$interest" '{name:"TEST ONLY",email:$email,city:"other",cityOther:"TEST CITY",interest:$interest,children:[],lang:"fr",consent:true}')
            curl -fsS "$endpoint/api/register" -H "Origin: $origin" -H 'Content-Type: application/json' -d "$data" | jq -e '.ok'
          done
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$endpoint/api/admin/list" -H "Origin: $origin" -H 'Content-Type: application/json' -d '{}')
          test "$code" = 403
      - name: Create only the isolated preview Pages project if needed
        if: github.ref == 'refs/heads/feature/admissions-session-registration'
        shell: bash
        run: |
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/asicc-admissions-preview"
          code=$(curl -sS -o /tmp/admissions-preview.json -w '%{http_code}' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$endpoint")
          if [ "$code" = 404 ]; then
            curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data '{"name":"asicc-admissions-preview","production_branch":"feature/admissions-session-registration"}'
          elif [ "$code" != 200 ]; then
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b941b206ccc2aad94ae9b83ada2bc889
      - name: Deploy only the new registration preview Pages project
        if: github.ref == 'refs/heads/feature/admissions-session-registration'
        run: npx wrangler@4 pages deploy dist --project-name=asicc-admissions-preview --branch=feature/admissions-session-registration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b941b206ccc2aad94ae9b83ada2bc889
      - name: Build production site without deployment
        if: github.ref == 'refs/heads/deploy/admissions-session-worker'
        run: npm run build
        env:
          SITE_URL: https://asicc-parents.fr
          BASE_PATH: /
          PUBLIC_ASICC_MEMBERS_ENABLED: 'true'
          PUBLIC_ASICC_BAZAAR_PRODUCTION: 'true'
          PUBLIC_ASICC_BAZAAR_PUBLIC_LINK: 'false'
      - name: Deploy new production registration Worker only
        if: github.ref == 'refs/heads/deploy/admissions-session-worker'
        run: npx wrangler@4 deploy --config worker/admissions/wrangler.production.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b941b206ccc2aad94ae9b83ada2bc889
      - name: Configure confirmation email if existing repository secret is available
        if: github.ref == 'refs/heads/deploy/admissions-session-worker'
        shell: bash
        run: |
          if [ -n "$ADMISSIONS_MAIL_KEY" ]; then
            printf '%s' "$ADMISSIONS_MAIL_KEY" | npx wrangler@4 secret put BREVO_API_KEY --config worker/admissions/wrangler.production.toml
          else
            echo 'Confirmation email key is not configured; data collection and admin export remain available.'
          fi
        env:
          ADMISSIONS_MAIL_KEY: ${{ secrets.BREVO_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b941b206ccc2aad94ae9b83ada2bc889
      - name: Verify production registration health without sending or storing real data
        if: github.ref == 'refs/heads/deploy/admissions-session-worker'
        shell: bash
        run: |
          set -euo pipefail
          endpoint=https://asicc-admissions-registration.falling-hall-f390.workers.dev
          curl -fsS --retry 8 --retry-delay 5 --retry-all-errors --max-time 15 "$endpoint/health" | jq -e '.ok and .mode == "production" and .open'
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$endpoint/api/admin/list" -H 'Origin: https://asicc-parents.fr' -H 'Content-Type: application/json' -d '{}')
          test "$code" = 403
