name: ASICC Firestore Rules Security Test
on:
  push:
    branches: [test-cms-fr, feat/online-bazaar]
    paths:
      - 'tests/firestore-rules.test.mjs'
      - 'tests/asicc-round9-policy.test.mjs'
      - 'tests/asicc-round10-regressions.test.mjs'
      - 'tests/asicc-round11-regressions.test.mjs'
      - 'tests/patch-regressions.test.mjs'
      - 'src/scripts/members/mailbox-view.ts'
      - 'src/scripts/members/display-date.ts'
      - 'src/scripts/members/dm-policy.ts'
      - 'firestore.rules'
      - 'firebase.test.json'
      - '.github/workflows/security-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install project dependencies
        run: npm ci
      - name: Run DM policy tests
        run: node --experimental-strip-types --test tests/asicc-*-regressions.test.mjs tests/asicc-round9-policy.test.mjs tests/asicc-b2-first.test.mjs tests/patch-regressions.test.mjs
      - name: Install rules testing library
        run: npm install --no-save @firebase/rules-unit-testing@4.0.1
      - name: Run Firestore rules tests with emulator (NO PRODUCTION ACCESS)
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-asicc-security --config firebase.test.json 'node --test tests/firestore-rules.test.mjs'
