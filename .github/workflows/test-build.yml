
name: ASICC Test Build

on:
  push:
    branches: [test-cms-fr]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build entire baseline test site against isolated services
        run: npm run build
        env:
          ASICC_BASELINE_TEST: 'true'
          CF_PAGES_BRANCH: test-cms-fr
