name: ASICC Private Resources Security Test
on:
  push:
    branches: [test-cms-fr, feat/online-bazaar]
    paths:
      - 'tests/media-rules.test.mjs'
      - 'firestore.rules'
      - '.github/workflows/private-content-security-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install project dependencies
        run: npm ci
      - name: Install rules testing library
        run: npm install --no-save @firebase/rules-unit-testing@4.0.1
      - name: Test private Firestore rules with local emulator only
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-asicc-media-rules --config firebase.test.json 'node --test tests/media-rules.test.mjs'
